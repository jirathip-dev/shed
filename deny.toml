[graph]
# The platforms CI builds; Windows-only crates stay out of the checks.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Zlib: foldhash, through serde_json's preserve_order, which the ACP SDK turns on.
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
# The ACP SDK's derive macros (derive_more, strum, tracing, pin-project) still build on syn 2; build time only.
skip = [{ crate = "syn@2.0.119", reason = "proc macros of the ACP SDK's dependencies; serde is on syn 3" }]
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
