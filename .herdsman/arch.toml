# `drover arch-check` (just arch): the generated files, the layers, the banned calls and the size limits.
# A generated file must equal what `generate` writes; an update round reruns it instead of merging (#116).
generated = ["CHANGELOG.md", "docs/protocol.md", "docs/shed.openrpc.json"]
generate = "just generate"

[[layer]]
name = "core"
paths = ["crates/shed-core/src/**"]
mods = ["shed_core"]
may_use = []

[[layer]]
name = "proto"
paths = ["crates/shed-proto/src/**"]
mods = ["shed_proto"]
may_use = []

[[layer]]
name = "server"
paths = ["crates/shed-server/src/**"]
mods = ["shed_server"]
may_use = ["core", "proto"]

[[layer]]
name = "cli"
paths = ["crates/shed/src/**"]
may_use = ["server"]

[[ban]]
pattern = "Command::new"
paths = ["crates/*/src/**"]
except = ["crates/shed-core/src/runner.rs"]
reason = "start processes through shed_core::runner"

[[ban]]
pattern = "std::process"
paths = ["crates/*/src/**"]
except = ["crates/shed-core/src/runner.rs"]
reason = "process types and calls come from shed_core::runner"

[[ban]]
pattern = "thread::sleep"
paths = ["crates/*/src/**"]
except = ["crates/shed-core/src/clock.rs"]
reason = "sleep through shed_core::clock"

[[ban]]
pattern = "env::var"
paths = ["crates/*/src/**"]
except = ["crates/shed-server/src/config.rs"]
reason = "read the environment through shed_server::config"

[[ban]]
pattern = "SystemTime::now"
paths = ["crates/*/src/**"]
except = ["crates/shed-core/src/clock.rs"]
reason = "read the time through shed_core::clock"

[[ban]]
pattern = "Instant::now"
paths = ["crates/*/src/**"]
except = ["crates/shed-core/src/clock.rs"]
reason = "read the time through shed_core::clock"

[[size]]
paths = ["crates/*/src/**/*.rs"]
max_file_lines = 2000
max_fn_lines = 150
