# Claude Code, and its ACP adapter. A file of the same name in <config>/providers/ overrides keys of this one.
id = "claude-acp"
agent = "claude"
auth_failures = ["Failed to authenticate", "OAuth session expired"]
limit = ["hit your limit", "usage limit reached"]
resets = ["resets "]
login = "claude auth login"
status = "claude auth status"
logout = "claude auth logout"
config_dir_var = "CLAUDE_CONFIG_DIR"
install = "curl -fsSL https://claude.ai/install.sh | bash"
token_var = "CLAUDE_CODE_OAUTH_TOKEN"
models = [["opus", "Opus"], ["fable", "Fable"], ["sonnet", "Sonnet"], ["haiku", "Haiku"]]
model_env = "ANTHROPIC_MODEL"
effort_args = ["--effort", "{effort}"]
efforts = ["low", "medium", "high", "xhigh", "max"]
setup_files = ["CLAUDE.md", "settings.json", "rules", "agents", "commands", "skills", "plugins"]
setup_ignore = ["skills/synced", "plugins/store", "plugins/synced", "plugins/.last_inuse_sweep"]
session_files = ["projects/*/{session}.jsonl"]
default_folder = "~/.claude"
scrub = ["CLAUDE_CODE_OAUTH_TOKEN"]

[quota]
path = ["quota", "token_count"]
input = "inputTokens"
cache_read = "cachedInputTokens"
cache_write = "cachedWriteTokens"
output = "outputTokens"

[cache]
plan = 3600
api = 300
api_vars = [
  "ANTHROPIC_API_KEY",
  "ANTHROPIC_AUTH_TOKEN",
  "CLAUDE_CODE_USE_BEDROCK",
  "CLAUDE_CODE_USE_VERTEX",
  "CLAUDE_CODE_USE_FOUNDRY"
]

# The accounts (docs/accounts/login.md): how the status and the usage read, the setup token, the token proxy.
[status_read]
format = "json"
signed_in = "loggedIn"
who = ["email", "orgName"]
how = "authMethod"

[usage]
command = "claude -p /usage"
env = { TZ = "UTC" }
unset = ["CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC"]
fresh = 300
hold = 3600

[[usage.windows]]
id = "5h"
line = "Current session:"
used = "% used"
resets = "resets "

[[usage.windows]]
id = "7d"
line = "Current week (all models):"
used = "% used"
resets = "resets "

[token]
command = "claude setup-token"
prefix = "sk-ant-oat"
days = 365

# The login finished on another device (`shed account login --remote`): the printed link's page shows a code to paste.
[remote_login]
link = "https://claude.ai/oauth/authorize"
answer = "paste"

# Where the login lives: the keychain item, which Claude Code reads first, and the file beside it (drift check).
[credentials]
file = ".credentials.json"
default_dir = ".claude"
service = "Claude Code-credentials"
folder_hash = 8
keychain = ["security", "find-generic-password", "-s", "{service}", "-w"]
missing = 44

[proxy]
upstream = "https://api.anthropic.com"
paths = ["/v1/"]
base_url_var = "ANTHROPIC_BASE_URL"
key_var = "ANTHROPIC_AUTH_TOKEN"
auth = "authorization: Bearer {token}"
append = { "anthropic-beta" = "oauth-2025-04-20" }

# The lock a claude killed mid-refresh leaves (anthropics/claude-code#95236): an empty one past Claude Code's own
# 60 s window is removed before a start.
[stale_lock]
file = ".oauth_refresh.lock"
secs = 60

# The stream driver: `claude`'s own stream-json mode. Off until <config>/providers/claude.toml says driver = "stream".
[stream]
wire = "claude"
command = [
  "claude",
  "-p",
  "--input-format",
  "stream-json",
  "--output-format",
  "stream-json",
  "--include-partial-messages",
  "--verbose",
  "--replay-user-messages"
]
adapter = "claude-agent-acp"
launchers = ["npx", "-y", "node"]
new = ["--session-id", "{session}"]
resume = ["--resume", "{session}"]
model = ["--model", "{model}"]
effort = ["--effort", "{effort}"]
mcp = ["--mcp-config", "{file}"]
plan = ["TodoWrite", "todos"]

[stream.policy]
allow = ["--permission-mode", "bypassPermissions", "--permission-prompts", "none"]
deny = ["--permission-mode", "default", "--permission-prompts", "none"]

[stream.meta]
"systemPrompt" = "--system-prompt"
"systemPrompt.append" = "--append-system-prompt"
"systemPrompt.excludeDynamicSections" = "--exclude-dynamic-system-prompt-sections"
"claudeCode.options.settingSources" = "--setting-sources"
"claudeCode.options.settings" = "--settings"
"claudeCode.options.strictMcpConfig" = "--strict-mcp-config"
"claudeCode.options.tools" = "--tools"
"claudeCode.options.allowedTools" = "--allowed-tools"
"claudeCode.options.disallowedTools" = "--disallowed-tools"
"claudeCode.options.model" = "--model"

[stream.tools]
Bash = ["execute", "command"]
Read = ["read", "file_path"]
Edit = ["edit", "file_path"]
Write = ["edit", "file_path"]
NotebookEdit = ["edit", "notebook_path"]
Grep = ["search", "pattern"]
Glob = ["search", "pattern"]
WebFetch = ["fetch", "url"]
WebSearch = ["fetch", "query"]
Task = ["think", "description"]

# What Claude Code needs inside a sandbox (`run`'s `sandbox`): srt takes the run's temp folder from `tmp_var`.
[sandbox]
tmp_var = "CLAUDE_CODE_TMPDIR"
read = ["~/.local/share/claude", "~/.local/bin/claude", "~/Library/Keychains"]
write = ["{config}", "~/.claude.json"]
hosts = ["*.anthropic.com", "claude.ai", "*.claude.ai"]
