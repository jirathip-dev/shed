# DeepSeek's API: an account of it is only a key (no config folder variable), whose balance shed reads.
# A file of the same name in <config>/providers/ overrides keys of this one.
agent = "deepseek"
token_var = "DEEPSEEK_API_KEY"

[balance]
url = "https://api.deepseek.com/user/balance"
auth = "Authorization: Bearer {token}"
currency = ["balance_infos", 0, "currency"]
total = ["balance_infos", 0, "total_balance"]
fresh = 600
