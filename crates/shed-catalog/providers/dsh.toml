# dsh-TUI, a terminal agent (no ACP). A file of the same name in <config>/providers/ overrides keys of this one.
id = "dsh"
agent = "dsh"
efforts = ["none"]

# How shed drives its screen, for a terminal labelled agent=dsh.
[terminal]
command = ["dsh-tui", "--patch", "{file}"]
processes = ["dsh-tui"]
idle_after = 2
version = { command = ["dsh-tui", "version"], line = "profile:", pin = "0.17.0" }
wizard = { any = ["Welcome to dsh-TUI", "欢迎使用 dsh-TUI"], keys = ["esc"], settle = 2 }
ready = { states = ["idle", "done"], secs = 90 }
echo = { chars = 20, attempts = 3, secs = 5 }
accepted = { states = ["working", "blocked", "done"], secs = 10 }
