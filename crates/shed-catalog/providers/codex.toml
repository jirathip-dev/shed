# Codex, and its ACP adapter. A file of the same name in <config>/providers/ overrides keys of this one.
id = "codex-acp"
agent = "codex"
limit = ["hit your usage limit"]
resets = ["try again at ", "Try again at ", "try again in ", "Try again in "]
login = "codex login"
status = "codex login status"
logout = "codex logout"
config_dir_var = "CODEX_HOME"
install = "npm install -g @openai/codex"
effort_args = ["-c", "model_reasoning_effort={effort}"]
efforts = ["low", "medium", "high", "xhigh"]
