# `drover arch-check` (just arch): the generated files, the layers, the banned calls and the size limits.
# A generated file must equal what `generate` writes; an update round reruns it instead of merging (#116).
# A frozen file takes no new line, a `shared` one stays under its `[[size]]` limit, and a row of a `[[collect]]`
# folder is a new file there (#246).
frozen = ["ci/cap.toml", "docs/acp/README.md", ".github/workflows/ci.yml"]
generated = [
    "CHANGELOG.md",
    "docs/protocol.md",
    "docs/shed.openrpc.json",
    "crates/shed-script/tests/perf/counts.json",
    "Cargo.lock",
    "crates/shed/tests/golden/**",
]
generate = "sh \"$(git rev-parse --show-toplevel)/scripts/arch-gen.sh\""
shared = [
    ".drover/arch.toml",
    ".drover/rules.md",
    "Cargo.toml",
    "justfile",
    "crates/shed-core/Cargo.toml",
    "crates/shed-core/src/lib.rs",
    "crates/shed-core/src/runner.rs",
    "crates/shed-core/tests/terminal.rs",
    "crates/shed-proto/tests/protocol_doc/acp.rs",
    "crates/shed-proto/tests/protocol_doc/terminal.rs",
    "crates/shed-server/Cargo.toml",
    "crates/shed-server/src/links.rs",
    "crates/shed-server/src/providers.rs",
    "crates/shed-server/src/providers/claude.rs",
    "crates/shed/tests/acp_bench.rs",
    "crates/shed/tests/*/main.rs",
    "crates/shed/tests/fake_acp.py",
    "crates/shed-core/src/terminal/mod.rs",
    "crates/shed-proto/src/lib.rs",
]

[[layer]]
name = "core"
paths = ["crates/shed-core/src/**"]
mods = ["shed_core"]
may_use = []

[[layer]]
name = "proto"
paths = ["crates/shed-proto/src/**"]
mods = ["shed_proto"]
may_use = []

[[layer]]
name = "client"
paths = ["crates/shed-client/src/**"]
mods = ["shed_client"]
may_use = ["proto"]

[[layer]]
name = "catalog"
paths = ["crates/shed-catalog/src/**"]
mods = ["shed_catalog"]
may_use = ["proto"]

[[layer]]
name = "pattern"
paths = ["crates/shed-pattern/src/**"]
mods = ["shed_pattern"]
may_use = []

[[layer]]
name = "search"
paths = ["crates/shed-search/src/**"]
mods = ["shed_search"]
may_use = ["pattern", "proto"]

[[layer]]
name = "script"
paths = ["crates/shed-script/src/**"]
mods = ["shed_script"]
may_use = ["proto", "pattern"]

[[layer]]
name = "server"
paths = ["crates/shed-server/src/**"]
mods = ["shed_server"]
may_use = ["core", "proto", "client", "catalog", "pattern", "search", "script"]

[[layer]]
name = "cli"
paths = ["crates/shed/src/**"]
may_use = ["server", "client"]

[[ban]]
pattern = "Hello::ours"
paths = ["crates/*/src/**"]
except = ["crates/shed-proto/src/**", "crates/shed-client/src/**", "crates/shed-server/src/lib.rs"]
reason = "shake hands through shed_client; only the server's dispatch answers a hello"

[[ban]]
pattern = "Command::new"
paths = ["crates/*/src/**"]
except = ["crates/shed-core/src/runner.rs"]
reason = "start processes through shed_core::runner"

[[ban]]
pattern = "std::process"
paths = ["crates/*/src/**"]
except = ["crates/shed-core/src/runner.rs"]
reason = "process types and calls come from shed_core::runner"

[[ban]]
pattern = "thread::sleep"
paths = ["crates/*/src/**"]
except = ["crates/shed-core/src/clock.rs"]
reason = "sleep through shed_core::clock"

[[ban]]
pattern = "env::var"
paths = ["crates/*/src/**"]
except = ["crates/shed-server/src/config.rs"]
reason = "read the environment through shed_server::config"

[[ban]]
pattern = "SystemTime::now"
paths = ["crates/*/src/**"]
except = ["crates/shed-core/src/clock.rs"]
reason = "read the time through shed_core::clock"

[[ban]]
pattern = "Instant::now"
paths = ["crates/*/src/**"]
except = ["crates/shed-core/src/clock.rs"]
reason = "read the time through shed_core::clock"

[[ban]]
pattern = "std::fs"
paths = ["crates/shed-script/src/**"]
except = []
reason = "the script engine is pure: it reaches the outside only through Host"

[[ban]]
pattern = "std::net"
paths = ["crates/shed-script/src/**"]
except = []
reason = "the script engine is pure: it reaches the outside only through Host"

[[ban]]
pattern = "std::os"
paths = ["crates/shed-script/src/**"]
except = []
reason = "the script engine is pure: it reaches the outside only through Host"

[[ban]]
pattern = "std::io"
paths = ["crates/shed-script/src/**"]
except = []
reason = "the script engine is pure: it reaches the outside only through Host"

[[ban]]
pattern = "std::thread"
paths = ["crates/shed-script/src/**"]
except = []
reason = "the script engine is pure: it reaches the outside only through Host"

[[ban]]
pattern = "std::time"
paths = ["crates/shed-script/src/**"]
except = []
reason = "the script engine is pure: it reaches the outside only through Host"

[[ban]]
pattern = "std::env"
paths = ["crates/shed-script/src/**"]
except = []
reason = "the script engine is pure: it reaches the outside only through Host"

[[ban]]
pattern = "tokio::"
paths = ["crates/shed-script/src/**"]
except = []
reason = "the script engine is pure: it reaches the outside only through Host"

[[ban]]
pattern = "fs::"
paths = ["crates/shed-search/src/**", "crates/shed-pattern/src/**"]
except = ["crates/shed-search/src/walk.rs"]
reason = "shed-search reads files only in walk.rs; shed-pattern reads none"

[[ban]]
pattern = "std::net"
paths = ["crates/shed-search/src/**", "crates/shed-pattern/src/**"]
except = []
reason = "search and patterns open no socket"

[[ban]]
pattern = "launchctl"
paths = ["crates/*/src/**"]
except = []
reason = "#238: jobs are written, loaded and restarted only by farrier-service"

[[ban]]
pattern = "systemctl"
paths = ["crates/*/src/**"]
except = []
reason = "#238: jobs are written, loaded and restarted only by farrier-service"

[[ban]]
pattern = "claude"
paths = ["crates/*/src/**"]
except = ["crates/*/src/providers/**", "crates/shed-server/src/providers.rs"]
reason = "#64: core names no agent or provider; agent specifics are data in crates/shed-catalog/providers/<name>.toml"
comments = true
ignore_case = true

[[ban]]
pattern = "anthropic"
paths = ["crates/*/src/**"]
except = ["crates/*/src/providers/**", "crates/shed-server/src/providers.rs"]
reason = "#64: core names no agent or provider; agent specifics are data in crates/shed-catalog/providers/<name>.toml"
comments = true
ignore_case = true

[[ban]]
pattern = "codex"
paths = ["crates/*/src/**"]
except = ["crates/*/src/providers/**", "crates/shed-server/src/providers.rs"]
reason = "#64: core names no agent or provider; agent specifics are data in crates/shed-catalog/providers/<name>.toml"
comments = true
ignore_case = true

[[ban]]
pattern = "openai"
paths = ["crates/*/src/**"]
except = ["crates/*/src/providers/**", "crates/shed-server/src/providers.rs"]
reason = "#64: core names no agent or provider; agent specifics are data in crates/shed-catalog/providers/<name>.toml"
comments = true
ignore_case = true

[[ban]]
pattern = "gemini"
paths = ["crates/*/src/**"]
except = ["crates/*/src/providers/**", "crates/shed-server/src/providers.rs"]
reason = "#64: core names no agent or provider; agent specifics are data in crates/shed-catalog/providers/<name>.toml"
comments = true
ignore_case = true

[[ban]]
pattern = "hermes"
paths = ["crates/*/src/**"]
except = ["crates/*/src/providers/**", "crates/shed-server/src/providers.rs"]
reason = "#64: core names no agent or provider; agent specifics are data in crates/shed-catalog/providers/<name>.toml"
comments = true
ignore_case = true

[[size]]
paths = ["crates/*/tests/**/*.rs"]
max_file_lines = 100000
max_fn_lines = 105

[comments]
policy = "on"

[[size]]
paths = ["crates/*/src/**/*.rs"]
max_file_lines = 2000
max_fn_lines = 105

[[collect]]
dir = "crates/shed-core/src/terminal"
glob = "*.rs"

[[collect]]
dir = "crates/shed-core/src/screen"
glob = "*.rs"

[[size]]
paths = ["crates/shed-core/src/terminal/mod.rs"]
max_file_lines = 350

[[collect]]
dir = "ci/cap.d"
glob = "*.toml"

[[collect]]
dir = "docs/acp"
glob = "**/[!R]*.md"

[[collect]]
dir = ".gatekeeper/gates"
glob = "*.toml"

[[collect]]
dir = "crates/shed-core/tests"
glob = "*.rs"

[[collect]]
dir = "crates/shed-server/src/providers"
glob = "*.rs"

[[size]]
paths = [".drover/rules.md", "crates/shed-core/Cargo.toml"]
max_file_lines = 30

[[size]]
paths = ["crates/shed-core/src/lib.rs"]
max_file_lines = 45

[[size]]
paths = ["crates/shed-server/Cargo.toml"]
max_file_lines = 55

[[size]]
paths = ["Cargo.toml"]
max_file_lines = 70

[[size]]
paths = ["justfile"]
max_file_lines = 135

[[size]]
paths = ["crates/shed-core/tests/terminal.rs"]
max_file_lines = 170

[[size]]
paths = ["crates/shed-core/src/runner.rs"]
max_file_lines = 200

[[size]]
paths = ["crates/shed-server/src/providers.rs", "crates/shed-proto/tests/protocol_doc/terminal.rs"]
max_file_lines = 230

[[size]]
paths = ["crates/shed-server/src/links.rs"]
max_file_lines = 250

[[size]]
paths = ["crates/shed-proto/tests/protocol_doc/acp.rs"]
max_file_lines = 300

[[size]]
paths = ["crates/shed-server/src/providers/claude.rs", "crates/shed/tests/acp_bench.rs"]
max_file_lines = 340

[[size]]
paths = [".drover/arch.toml"]
max_file_lines = 400

[[collect]]
dir = "crates/shed/tests"
glob = "*/*.rs"

[[collect]]
dir = "crates/shed/tests/fake_acp"
glob = "*.py"

[[size]]
paths = ["crates/shed/tests/fake_acp.py"]
max_file_lines = 260

[[size]]
paths = ["crates/shed/tests/*/main.rs"]
max_file_lines = 300

[[collect]]
dir = "crates/shed-proto/methods"
glob = "*.md"

[[collect]]
dir = "crates/shed-proto/errors"
glob = "*.md"

[[size]]
paths = ["crates/shed-proto/src/lib.rs"]
max_file_lines = 80
