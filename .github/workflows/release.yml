name: release
# #160: after ci ends green on a push to main or staging, build shed for macOS (signed, notarized) and Linux and
# publish a GitHub release: build-<sha7> on main (kept), build-staging-<sha7> on staging (a prerelease, pruned after 14
# days), with the fake ssh link for multi-host tests (#308) as shed-fake-link.py. A failed step ends its job green with
# an ::error:: annotation and publishes nothing (docs/releases.md).
# #338: this file runs from the default branch (staging) on a checkout of the built sha, which may be behind it: a file
# only newer commits have (scripts/fake-link.py) is skipped with a ::notice:: when absent; the binaries stay required.
# #267: on main it also tags client-v<PROTOCOL>.<n> when a client crate changed; started by hand it is a dry run.
# #356: a workflow_run run carries the default branch's head branch and sha in Actions' run list, so run-name names
# the built branch and sha. Started by hand with a main sha and publish: true it builds, publishes and tags that sha.
run-name: >-
  release ${{ github.event.workflow_run.head_branch || 'by hand' }}
  ${{ github.event.workflow_run.head_sha || inputs.sha }}
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      sha:
        description: a commit on main to build (empty is a dry run of the dispatched ref)
        default: ""
      publish:
        description: build, publish build-<sha7> and push its client tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  target:
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.t.outputs.sha }}
      branch: ${{ steps.t.outputs.branch }}
      publish: ${{ steps.t.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: t
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ -n "$RUN_SHA" ]; then
            printf 'sha=%s\nbranch=%s\npublish=true\n' "$RUN_SHA" "$RUN_BRANCH" >> "$GITHUB_OUTPUT"
          elif [ -z "$INPUT_SHA" ]; then
            [ "$INPUT_PUBLISH" != true ] || { echo "::error::publish needs a sha"; exit 1; }
            printf 'sha=%s\nbranch=main\npublish=false\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif sha=$(git rev-parse --verify --quiet "$INPUT_SHA^{commit}") &&
            git merge-base --is-ancestor "$sha" origin/main; then
            printf 'sha=%s\nbranch=main\npublish=%s\n' "$sha" "$INPUT_PUBLISH" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$INPUT_SHA is not a commit on main"
            exit 1
          fi

  client-tag:
    needs: target
    if: needs.target.outputs.branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLISH: ${{ needs.target.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.sha }}
          fetch-depth: 0
      - name: tag a client release (a dry run unless publishing)
        run: |
          if [ "$PUBLISH" != true ]; then
            scripts/client-tag.sh HEAD
          elif ! scripts/client-tag.sh --push HEAD; then
            echo "::error::the client release tag failed"
          fi

  linux:
    needs: target
    if: needs.target.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    outputs:
      ok: ${{ steps.build.outputs.ok }}
    env:
      SHA: ${{ needs.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: x86_64-unknown-linux-gnu
      - id: build
        run: |
          t=x86_64-unknown-linux-gnu
          if cargo build --release --locked -p shed --target "$t" && cp "target/$t/release/shed" "shed-$t" &&
            "./shed-$t" --version | grep -q "($(printf %.7s "$SHA")"; then
            echo ok=true >> "$GITHUB_OUTPUT"
          else
            echo "::error::the Linux build (or its --version sha check) failed; nothing is published"
          fi
      - if: steps.build.outputs.ok == 'true'
        run: |
          if [ -f scripts/fake-link.py ]; then
            cp scripts/fake-link.py shed-fake-link.py
          else
            echo "::notice::scripts/fake-link.py is not at $SHA; the release ships without shed-fake-link.py"
          fi
      - if: steps.build.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            shed-x86_64-unknown-linux-gnu
            shed-fake-link.py

  macos:
    needs: target
    if: needs.target.outputs.publish == 'true'
    runs-on: macos-latest
    environment: release
    outputs:
      ok: ${{ steps.sign.outputs.ok }}
    env:
      SHA: ${{ needs.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: aarch64-apple-darwin
      - id: build
        run: |
          t=aarch64-apple-darwin
          if cargo build --release --locked -p shed --target "$t" && cp "target/$t/release/shed" "shed-$t" &&
            "./shed-$t" --version | grep -q "($(printf %.7s "$SHA")"; then
            echo ok=true >> "$GITHUB_OUTPUT"
          else
            echo "::error::the macOS build (or its --version sha check) failed; nothing is published"
          fi
      - id: sign
        if: steps.build.outputs.ok == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          if sh scripts/release-sign.sh shed-aarch64-apple-darwin; then
            echo ok=true >> "$GITHUB_OUTPUT"
          else
            echo "::error::signing, notarization or its check failed; nothing is published"
          fi
      - if: steps.sign.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: shed-aarch64-apple-darwin

  publish:
    needs: [target, linux, macos]
    if: needs.linux.outputs.ok == 'true' && needs.macos.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ needs.target.outputs.sha }}
      BRANCH: ${{ needs.target.outputs.branch }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: publish
        run: |
          s=$(printf %.7s "$SHA")
          if [ "$BRANCH" = main ]; then tag="build-$s" pre=""; else tag="build-$BRANCH-$s" pre=1; fi
          assets=(shed-aarch64-apple-darwin shed-x86_64-unknown-linux-gnu)
          if [ -f shed-fake-link.py ]; then assets+=(shed-fake-link.py); else echo "::notice::no shed-fake-link.py at $SHA"; fi
          sha256sum "${assets[@]}" > SHA256SUMS
          if ! gh release create "$tag" -R "$REPO" --target "$SHA" --title "$tag" --notes "shed $BRANCH @ $SHA" \
            ${pre:+"--prerelease"} "${assets[@]}" SHA256SUMS; then
            echo "::error::publishing $tag failed"
          fi
      - name: prune staging prereleases over 14 days old
        if: env.BRANCH == 'staging'
        run: |
          cut=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh release list -R "$REPO" --limit 1000 --json tagName,isPrerelease,createdAt \
            --jq ".[] | select(.isPrerelease and (.tagName | startswith(\"build-staging-\")) and .createdAt < \"$cut\") | .tagName" |
            while read -r t; do
              gh release delete "$t" -R "$REPO" --cleanup-tag -y || echo "::error::could not delete $t"
            done || echo "::error::pruning failed"
