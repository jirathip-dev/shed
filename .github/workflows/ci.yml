name: ci
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: jirathip-dev/gatekeeper/.github/workflows/gates.yml@c76c64fa790a1a5e5e608c25139960e74db8b44d # v1.1.0
    with:
      runners: >-
        ${{ vars.CI_RUNNER && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
          && format('{{"linux": "ubuntu-latest", "macos": {0}}}', vars.CI_RUNNER)
          || '{"linux": "ubuntu-latest", "macos": "macos-latest"}' }}
    secrets:
      private-names: ${{ secrets.PRIVATE_NAMES }}
