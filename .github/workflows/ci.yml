name: ci
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every gate on the MSRV toolchain (rust-toolchain.toml), on Linux and macOS.
  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - name: fmt
        run: just fmt
      - name: clippy (pedantic, at most 10 allows)
        run: just clippy
      - name: test
        run: just test
      - name: tests leave no temp folders (no shed-* in the temp dir)
        run: just temp-left
      - name: timing report (soft, < 20 ms per non-waiting call)
        run: just bench
      - name: doc
        run: just doc
      - name: deny (licences, advisories, duplicate versions)
        run: just deny
      - name: line cap (≤ 5,000 non-test lines in crates/*/src)
        run: just cap
      - name: dependency direction (shed-core has no workspace deps)
        run: just deps
      - name: public hygiene (ci/denylist.txt)
        run: just hygiene
      - name: neutral core (no agent or provider names outside providers/)
        run: just neutral
      - name: comment rule (no //; /// on public API only)
        run: just comments

  # The fleet-wide rules: actionlint, herdsman's arch-check (layers, only shed_core::runner starts processes, size
  # limits in .herdsman/arch.toml) and lesson checks (.herdsman/rules.md), each with the fixtures that break it.
  rules:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: install actionlint 1.7.12
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz |
            tar -xz -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: install herdsman
        run: cargo install --locked --git https://github.com/jirathip-dev/herdsman --branch staging herdsman
      - name: actionlint (.github/workflows)
        run: just actionlint
      - name: arch-check (.herdsman/arch.toml)
        run: just arch
      - name: lesson checks (active fail, shadow report)
        run: just lessons

  stable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: test
        run: cargo test --workspace --locked

  # The event fan-out bench at the PR's base and head on one runner, median of 5 each; fails if the
  # head is more than 10% slower.
  bench-fanout:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: fan-out bench, base vs head
        run: BENCH_TARGET="$RUNNER_TEMP/bench" scripts/bench-fanout.sh base .

  # The ACP benches at the PR's base and head on one runner: throughput (median of 5) and shed-only (canned
  # updates, median of 9); fails if the head is more than 10% slower on either. Then the head's
  # session/load replay time.
  bench-acp:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: ACP bench, base vs head
        run: BENCH_TARGET="$RUNNER_TEMP/bench" scripts/bench-acp.sh base .
