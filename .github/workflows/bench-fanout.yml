name: bench-fanout
on:
  pull_request:
    branches: [main, staging]

# A new push to a PR cancels its older run of this bench.
concurrency:
  group: bench-fanout-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The event fan-out bench at the PR's base and head on one runner, median of 5 each; fails if the
  # head is more than 10% slower.
  bench-fanout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: dtolnay/rust-toolchain@1.120.0
      - name: fan-out bench, base vs head
        run: BENCH_TARGET="$RUNNER_TEMP/bench" scripts/bench-fanout.sh base .
