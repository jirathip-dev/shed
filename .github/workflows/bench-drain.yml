name: bench-drain
on:
  pull_request:
    branches: [main, staging]

# A new push to a PR cancels its older run of this bench.
concurrency:
  group: bench-drain-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The drain bench at the PR's base and head on one runner: 100 MB of plain, coloured and full-screen
  # redraw output through serve, median of 5 each; fails if the head is more than 10% slower on any.
  bench-drain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: drain bench, base vs head
        run: BENCH_TARGET="$RUNNER_TEMP/bench" scripts/bench-drain.sh base .
