name: bench-acp
on:
  pull_request:
    branches: [main, staging]

# A new push to a PR cancels its older run of this bench.
concurrency:
  group: bench-acp-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The ACP benches at the PR's base and head on one runner: throughput (median of 5) and shed-only (canned
  # updates, median of 9); fails if the head is more than 10% slower on either. Then the head's
  # session/load replay time.
  bench-acp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: dtolnay/rust-toolchain@1.120.0
      - name: ACP bench, base vs head
        run: BENCH_TARGET="$RUNNER_TEMP/bench" scripts/bench-acp.sh base .
