[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jirathip-dev/shed"
publish = false

[workspace.dependencies]
shed-proto = { path = "crates/shed-proto" }
shed-client = { path = "crates/shed-client" }
shed-catalog = { path = "crates/shed-catalog" }
shed-accounts = { path = "crates/shed-accounts" }
shed-core = { path = "crates/shed-core" }
shed-pattern = { path = "crates/shed-pattern" }
shed-search = { path = "crates/shed-search" }
shed-script = { path = "crates/shed-script" }
shed-secrets = { path = "crates/shed-secrets" }
shed-server = { path = "crates/shed-server" }
agent-client-protocol = "=5.5.1"
farrier-service = { git = "https://github.com/jirathip-dev/farrier", rev = "d34a7bb8388ef183c981dc01483634a87f0d3495" }
anyhow = "=1.0.104"
clap = { version = "=4.6.9", features = ["derive"] }
futures = { version = "=0.3.34", default-features = false, features = ["std"] }
pty-process = "=0.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
schemars = "=1.2.3"
security-framework = { version = "=3.7.0", default-features = false, features = ["OSX_10_14"] }
sha2 = { version = "=0.11.1", default-features = false }
rustix = { version = "=1.1.6", features = ["param", "process"] }
thiserror = "=2.0.21"
toml = { version = "=1.2.2", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "=1.54.1", default-features = false }
unicode-width = { version = "=0.2.3", default-features = false }
vte = { version = "=0.15.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
too_many_lines = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package.shed-script]
opt-level = 3
