about = "each ci/fixtures/arch-*/ breaks one rule of .drover/arch.toml (a layer, a ban, a size), and core/arch must refuse it"
fix = "a fixture passed: the rule it breaks no longer bites; fix the rule in .drover/arch.toml"
budget_secs = 120
paths = [".drover/**", "ci/fixtures/arch-*/**"]
run = """
set -eu
tmp=$(mktemp -d)
trap 'rm -rf "${tmp:?}"' EXIT
for d in ci/fixtures/arch-*/; do
  t="$tmp/$(basename "$d")"
  mkdir -p "$t/.drover" "$t/.gatekeeper" "$t/scripts"
  cp -R "$d". "$t/"
  cp .drover/arch.toml "$t/.drover/"
  cp .gatekeeper/run .gatekeeper/config.toml "$t/.gatekeeper/"
  : > "$t/scripts/arch-gen.sh"
  git -C "$t" init -q
  git -C "$t" add -A
  status=0
  "$t/.gatekeeper/run" check --gate core/arch --no-cache > "$t.log" 2>&1 || status=$?
  if [ "$status" -ne 1 ]; then cat "$t.log"; echo "$d: core/arch exited $status, not 1 (a finding)"; exit 1; fi
  echo "$d: refused"
done
"""
