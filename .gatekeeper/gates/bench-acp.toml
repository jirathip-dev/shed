about = "the acp bench at the pull request's base and head on one runner (scripts/bench-acp.sh): fails if the head is more than 10% slower; CI only (a quiet host)"
fix = "the log names the bench and both medians; find what the head made slower"
budget_secs = 900
leg = "bench-acp"
needs = ["quiet-host"]
setup = ["rust"]
paths = ["crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "scripts/bench-acp.sh"]
run = """
set -eu
set -- {--base}
if [ $# -lt 2 ]; then echo "bench-acp: runs on a pull request, base against head"; exit 0; fi
base="${RUNNER_TEMP:-target}/bench-acp-base"
git worktree add --detach "$base" "$2"
trap 'git worktree remove --force "$base"' EXIT
BENCH_TARGET="${RUNNER_TEMP:-target}/bench" scripts/bench-acp.sh "$base" .
"""
